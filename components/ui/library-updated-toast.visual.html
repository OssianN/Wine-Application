<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Library updated toast</title>
    <link rel="stylesheet" href="./library-updated-toast.visual.css" />
    <style>
      html,
      body {
        margin: 0;
        background: #8aa0b8;
      }
    </style>
  </head>
  <body>
    <main class="min-h-screen flex items-center justify-center p-8">
      <div
        id="data-toast"
        class="relative flex flex-col md:flex-row gap-4 w-full max-w-lg items-stretch md:items-center justify-between overflow-hidden rounded-md border p-6 pr-10 shadow-lg bg-background text-foreground"
      >
        <div class="grid gap-1 w-full min-w-0 text-left">
          <p class="text-sm font-semibold">Library updated</p>
          <p class="text-sm opacity-90">
            Updated 39 wines. 90 skipped, 0 failed.
          </p>
        </div>
        <button
          type="button"
          class="absolute right-1 top-1 rounded-md p-1 text-foreground/50"
          aria-label="Close"
        >
          ✕
        </button>
      </div>
    </main>
  </body>
</html>
